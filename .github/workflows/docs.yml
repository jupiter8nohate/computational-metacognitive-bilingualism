name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "assets/**"
      - "machine/**"
      - "agents/**"
      - "extensions/**"
      - "library/**"
      - "schemas/**"
      - "research/case-studies/**"
      - "spec/**"
      - "src/cmb_machine/**"
      - "src/cmb_agents/**"
      - "scripts/build_docs.py"
      - "tests/test_site_integrity.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "AGENTS.md"
      - "llms.txt"
      - "llms-full.txt"
      - "12d2a43be91ea62d037b07cba4432de24a5713f7fc4d3f50a8c5d468c3a43176.txt"
      - "CITATION.bib"
      - "CITATION.cff"
      - "robots.txt"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "assets/**"
      - "machine/**"
      - "agents/**"
      - "extensions/**"
      - "library/**"
      - "schemas/**"
      - "research/case-studies/**"
      - "spec/**"
      - "src/cmb_machine/**"
      - "src/cmb_agents/**"
      - "scripts/build_docs.py"
      - "tests/test_site_integrity.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "AGENTS.md"
      - "llms.txt"
      - "llms-full.txt"
      - "12d2a43be91ea62d037b07cba4432de24a5713f7fc4d3f50a8c5d468c3a43176.txt"
      - "CITATION.bib"
      - "CITATION.cff"
      - "robots.txt"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: python -m pip install --upgrade pip ".[docs]"

      - name: Build and verify public documentation bundle
        run: python scripts/build_docs.py
