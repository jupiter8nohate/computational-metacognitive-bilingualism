name: Deploy documentation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "spiders-internet/**"
      - "datasets/**"
      - "assets/**"
      - "machine/**"
      - "agents/**"
      - "extensions/**"
      - "library/**"
      - "schemas/**"
      - "research/case-studies/**"
      - "research/world-retina/**"
      - "books/**"
      - "policy/**"
      - "archive/conversations/**"
      - "examples/world_retina/**"
      - "examples/polyglot/jupiter_glitchology_runtime/**"
      - "spec/**"
      - "src/cmb_machine/**"
      - "src/cmb_agents/**"
      - "scripts/build_docs.py"
      - "scripts/update_global_ai_watch.py"
      - "scripts/build_epistemic_radar.py"
      - "scripts/build_observatory.py"
      - "scripts/generate_dna_witness.py"
      - "scripts/persist_watch_history.py"
      - "tests/test_watch_observatory.py"
      - "tests/test_site_integrity.py"
      - "tests/test_global_ai_watch.py"
      - "tests/test_epistemic_radar.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "AGENTS.md"
      - "llms.txt"
      - "llms-full.txt"
      - "12d2a43be91ea62d037b07cba4432de24a5713f7fc4d3f50a8c5d468c3a43176.txt"
      - "CITATION.bib"
      - "CITATION.cff"
      - "robots.txt"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip ".[docs]"

      - name: Refresh Global AI Watch snapshot
        run: python scripts/update_global_ai_watch.py --allow-stale

      - name: Preserve historical collections and assess sources
        run: python scripts/build_observatory.py

      - name: Build CMB Epistemic Radar from shared evidence
        run: python scripts/build_epistemic_radar.py --use-watch-snapshot

      - name: Generate noncanonical D.N.A. Living Codex
        run: python scripts/generate_dna_witness.py

      - name: Preserve archival collection in Git history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/persist_watch_history.py

      - name: Build and verify public documentation bundle
        run: python scripts/build_docs.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # A successful deploy is not proof that the published URLs are reachable.
      # Retry around CDN propagation and fail visibly if the public site is unreachable.
      - name: Verify published search endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://jupiter8nohate.github.io/computational-metacognitive-bilingualism"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/" -o /tmp/cmb-home.html
          grep -Fqi "Computational Metacognitive Bilingualism" /tmp/cmb-home.html
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/sitemap.xml" -o /tmp/cmb-sitemap.xml
          grep -Fq "<urlset" /tmp/cmb-sitemap.xml
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/google57d4128d590e83d8.html" -o /tmp/cmb-google-verification.html
          grep -Fq "google-site-verification: google57d4128d590e83d8.html" /tmp/cmb-google-verification.html
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/machine/global-ai-watch-health.json" -o /tmp/cmb-watch-health.json
          python - <<'PY'
          import json
          with open("/tmp/cmb-watch-health.json", encoding="utf-8") as source:
              data = json.load(source)
          assert data.get("schema_version") == "cmb.watch-health.v1"
          print("Live Global AI Watch:", data.get("status"), data.get("last_successful_collection"))
          PY
          # Assert that the published design and original illustrated story use the red-gold identity.
          grep -Fq 'cmb-stage' /tmp/cmb-home.html
          grep -Fq 'cmb-red-gold.css' /tmp/cmb-home.html
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/stylesheets/cmb-red-gold.css" -o /tmp/cmb-red-gold.css
          grep -Fq -- '--cmb-gold:#ffc72c' /tmp/cmb-red-gold.css
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/spiders-internet/" -o /tmp/cmb-spider-story.html
          grep -Fq -- '--accent:#ffc72c' /tmp/cmb-spider-story.html
          grep -Fq 'id="film"' /tmp/cmb-spider-story.html
          if grep -Eiq '#(ff70b2|ef75b4|241135|a77bd8|a78bfa)' /tmp/cmb-spider-story.html; then
            echo "::error::The published illustrated story still contains deprecated purple or pink colors."
            exit 1
          fi
          echo "Published red-gold styling, canonical Spider story, and film anchor verified."
          # Verify every chapter in the five-part 2084 arc, not just the homepage.
          for slug in \
            "2084/" \
            "DEATH_NOTE_2084/" \
            "DEATH_NOTE_2084_FALSE_LIGHT/" \
            "DEATH_NOTE_2084_HOUSE_OF_A_MILLION_DOORS/" \
            "DEATH_NOTE_2084_LEDGER_OF_INVISIBLE_CELLS/" \
            "DEATH_NOTE_2084_CHILD_WHO_REFUSED_THE_UPDATE/"; do
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/$slug" -o /dev/null
          done
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$base/2084/" -o /tmp/cmb-2084-arc.html
          grep -Fqi "THE FIVE TRANSMISSIONS" /tmp/cmb-2084-arc.html
          echo "Public homepage, sitemap, verification, Watch health, and all five 2084 transmissions are reachable."

      - name: Alert on Watch outage of six hours or longer
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          with open("/tmp/cmb-watch-health.json", encoding="utf-8") as source:
              data = json.load(source)
          if data.get("alert_required"):
              print("::error::Global AI Watch has not collected new metadata within six hours")
              sys.exit(1)
          print("Watch collection is within the six-hour outage alert threshold")
          PY

      # IndexNow is not a Google indexing API. Only notify after content-related
      # deployments, not after every scheduled hourly documentation refresh.
      - name: Notify IndexNow
        if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          INDEXNOW_KEY: "12d2a43be91ea62d037b07cba4432de24a5713f7fc4d3f50a8c5d468c3a43176"
          INDEXNOW_SITE: "https://jupiter8nohate.github.io/computational-metacognitive-bilingualism"
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/indexnow.json
          import json, os
          site = os.environ["INDEXNOW_SITE"].rstrip("/")
          key = os.environ["INDEXNOW_KEY"]
          urls = [
              f"{site}/",
              f"{site}/sitemap.xml",
              f"{site}/fables/",
              f"{site}/spiders-internet/",
              f"{site}/2084/",
              f"{site}/DEATH_NOTE_2084/",
              f"{site}/DEATH_NOTE_2084_FALSE_LIGHT/",
              f"{site}/DEATH_NOTE_2084_HOUSE_OF_A_MILLION_DOORS/",
              f"{site}/DEATH_NOTE_2084_LEDGER_OF_INVISIBLE_CELLS/",
              f"{site}/DEATH_NOTE_2084_CHILD_WHO_REFUSED_THE_UPDATE/",
              f"{site}/fables/PHANTOM_TOKENBOOTH/",
              f"{site}/fables/QUIET_WARS_SILENT_WEAPONS/",
              f"{site}/fables/THE_HARDWARE_HERESY/",
              f"{site}/fables/AGENTIC_SECTOR/",
              f"{site}/SEARCH_FOR_TRUTH/",
              f"{site}/DARK_FEDERALISM_VISUAL_SYSTEM/",
              f"{site}/DEVELOPERS/",
              f"{site}/RESEARCHERS/",
              f"{site}/CMB_EPISTEMIC_RADAR/",
              f"{site}/machine/cmb-epistemic-radar.json",
              f"{site}/machine/cmb-epistemic-radar-config.json",
              f"{site}/schemas/cmb.epistemic-radar.v1.schema.json",
              f"{site}/GLOBAL_AI_WATCH/",
              f"{site}/machine/global-ai-watch.json",
              f"{site}/machine/global-ai-watch-config.json",
              f"{site}/schemas/cmb.global-ai-watch.v1.schema.json",
              f"{site}/library/catalog.json",
              f"{site}/machine/generated/manifest.json",
              f"{site}/llms.txt",
              f"{site}/llms-full.txt",
              f"{site}/FAQ/",
              f"{site}/GLOSSARY/",
              f"{site}/CMB_CONVERSATION_ATLAS/",
              f"{site}/CMB_POLYGLOT_TRANSLATIONS/",
              f"{site}/JUPITER_POLYGLOT_RUNTIME/",
              f"{site}/examples/polyglot/jupiter_glitchology_runtime/README.md",
              f"{site}/examples/polyglot/jupiter_glitchology_runtime/main.go",
              f"{site}/examples/polyglot/jupiter_glitchology_runtime/mirror.py",
              f"{site}/library/cmb-conversation-atlas.v1.json",
              f"{site}/schemas/cmb.conversation-atlas.v1.schema.json",
              f"{site}/CASE_STUDIES/",
              f"{site}/research/case-studies/2026-09-04_GOOGLE_GENERATIVE_MISCLASSIFICATION.json",
              f"{site}/concepts/",
              f"{site}/concepts/what-is-cmb/",
              f"{site}/concepts/pattern-not-proof/",
              f"{site}/concepts/profile-not-person/",
              f"{site}/concepts/model-not-mind/",
              f"{site}/concepts/prediction-not-destiny/",
              f"{site}/concepts/human-agency-machine-authority/",
              f"{site}/concepts/self-authorization/",
              f"{site}/concepts/cognitive-sovereignty/",
              f"{site}/concepts/cmb-z13/",
              f"{site}/concepts/flamingoglyph-code/",
              f"{site}/concepts/cmb-provenance/",
              f"{site}/machine/index.json",
              f"{site}/machine/discovery-manifest.json",
              f"{site}/machine/recovery-map.json",
              f"{site}/datasets/cmb-canonical-corpus/manifest.json",
              f"{site}/datasets/cmb-canonical-corpus/corpus.jsonl",
              f"{site}/schemas/cmb.recovery-map.v1.schema.json",
              f"{site}/schemas/cmb.canonical-corpus-manifest.v1.schema.json",
              f"{site}/schemas/cmb.canonical-corpus-record.v1.schema.json",
              f"{site}/machine/knowledge-graph.jsonld",
              f"{site}/agents/agent-card.json",
              f"{site}/agents/registry.json",
              f"{site}/schemas/cmb.discovery.v1.schema.json",
              f"{site}/WORLD_RETINA_THE_RECIPROCAL_EYE/",
              f"{site}/PRE_2084_THE_EYE_ARRIVES/",
              f"{site}/CMB_THE_TWO_LOOPS/",
              f"{site}/CMB_TEN_CIVIC_FORKS/",
              f"{site}/world-retina/",
              f"{site}/books/CMB_WORLD_RETINA.md",
              f"{site}/policy/CMB_RECIPROCAL_OBSERVABILITY.md",
              f"{site}/research/world-retina/CLAIM_MATRIX.md",
              f"{site}/examples/world_retina/cmb_evoeye.py",
              f"{site}/examples/world_retina/world_retina.py",
              f"{site}/archive/conversations/2026-09-19-world-retina-origin.md",
              f"{site}/library/cmb-eye-ontology.v1.json",
              f"{site}/schemas/cmb.eye-ontology.v1.schema.json",
          ]
          payload = {
              "host": "jupiter8nohate.github.io",
              "key": key,
              "keyLocation": f"{site}/{key}.txt",
              "urlList": urls,
          }
          print(json.dumps(payload, separators=(",", ":")))
          PY
          curl --fail-with-body --silent --show-error             --header "Content-Type: application/json; charset=utf-8"             --data-binary @/tmp/indexnow.json             https://api.indexnow.org/indexnow
