name: MCP compatibility

on:
  push:
    paths:
      - "src/cmb_agents/**"
      - "src/cmb_cap/**"
      - "src/cmb_sdl/**"
      - "src/cmb_machine/**"
      - "agents/**"
      - "tests/test_mcp_adapter.py"
      - "pyproject.toml"
      - ".github/workflows/mcp-compatibility.yml"
  pull_request:
    paths:
      - "src/cmb_agents/**"
      - "src/cmb_cap/**"
      - "src/cmb_sdl/**"
      - "src/cmb_machine/**"
      - "agents/**"
      - "tests/test_mcp_adapter.py"
      - "pyproject.toml"
      - ".github/workflows/mcp-compatibility.yml"

permissions:
  contents: read

jobs:
  mcp-python:
    name: MCP Python 2.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CMB with MCP adapter
        run: python -m pip install --upgrade pip ".[test,mcp]"

      - name: Verify dependency graph
        run: python -m pip check

      - name: Import MCP server
        run: >-
          python -c
          "from cmb_agents.mcp_server import mcp;
          assert mcp is not None;
          print(type(mcp).__name__)"

      - name: Verify core agent self-test still passes
        run: cmb-agent selftest

      - name: Run MCP protocol smoke test
        run: pytest tests/test_mcp_adapter.py
