name: C2PA round-trip

on:
  push:
    paths:
      - "src/cmb_provenance/c2pa.py"
      - "src/cmb_provenance/cli.py"
      - "src/cmb_provenance/schemas.py"
      - "schemas/cmb.c2pa-assertion-payload.v1.schema.json"
      - "scripts/make_c2pa_test_png.py"
      - "scripts/verify_c2pa_roundtrip.py"
      - "tests/fixtures/c2pa_*"
      - ".github/workflows/c2pa-integration.yml"
  pull_request:
    paths:
      - "src/cmb_provenance/c2pa.py"
      - "src/cmb_provenance/cli.py"
      - "src/cmb_provenance/schemas.py"
      - "schemas/cmb.c2pa-assertion-payload.v1.schema.json"
      - "scripts/make_c2pa_test_png.py"
      - "scripts/verify_c2pa_roundtrip.py"
      - "tests/fixtures/c2pa_*"
      - ".github/workflows/c2pa-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c2patool-roundtrip:
    runs-on: ubuntu-latest
    env:
      C2PATOOL_VERSION: "0.27.18"
      C2PATOOL_SHA256: "839866d44227a1a09f3cb01ff060bb08700526eaa2a30ea48134e97911ecec1b"
      C2PA_TEST_LABEL: "com.example.cmb_provenance"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CMB package
        run: python -m pip install --upgrade pip .

      - name: Install pinned c2patool
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/c2patool.tar.gz"
          url="https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v${C2PATOOL_VERSION}/c2patool-v${C2PATOOL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${C2PATOOL_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p /tmp/c2patool "$HOME/.local/bin"
          tar -xzf "$archive" -C /tmp/c2patool
          binary="$(find /tmp/c2patool -type f -name c2patool -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" "$HOME/.local/bin/c2patool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm external tool version
        run: c2patool -V

      - name: Build deterministic test asset
        run: python scripts/make_c2pa_test_png.py build/c2pa/source.png

      - name: Build C2PA manifest definition
        run: >-
          cmb-provenance build-c2pa-manifest
          --receipt tests/fixtures/c2pa_receipt.json
          --assertion-label "$C2PA_TEST_LABEL"
          --test-example-namespace
          --output build/c2pa/manifest.json

      - name: Sign and bind with c2patool development signer
        run: >-
          c2patool build/c2pa/source.png
          --manifest build/c2pa/manifest.json
          --create algorithmicMedia
          --output build/c2pa/signed.png
          --force

      - name: Read signed asset with generic c2patool
        run: c2patool build/c2pa/signed.png > build/c2pa/report.json

      - name: Verify exact CMB payload survived round-trip
        run: >-
          python scripts/verify_c2pa_roundtrip.py
          --report build/c2pa/report.json
          --expected-payload tests/fixtures/c2pa_payload.expected.json
          --assertion-label "$C2PA_TEST_LABEL"
