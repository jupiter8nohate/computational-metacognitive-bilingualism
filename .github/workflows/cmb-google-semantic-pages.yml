name: CMB Google Semantic Pages

on:
  push:
    branches: ["main"]
    paths:
      - "manifestos/CMB_SOVEREIGN_TRANSMISSION.md"
      - "labs/cmb-google-semantic-bridge/**"
      - ".github/workflows/cmb-google-semantic-pages.yml"
      - "agents/**"
      - "src/cmb_agents/**"
  pull_request:
    branches: ["main"]
    paths:
      - "manifestos/CMB_SOVEREIGN_TRANSMISSION.md"
      - "labs/cmb-google-semantic-bridge/**"
      - ".github/workflows/cmb-google-semantic-pages.yml"
      - "agents/**"
      - "src/cmb_agents/**"
  workflow_dispatch:

concurrency:
  group: cmb-google-semantic-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build semantic publication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/cmb-google-semantic-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Test publisher
        run: go test -race ./...

      - name: Build Sovereign Transmission site
        run: |
          rm -rf /tmp/cmb-gsb-pages
          go run ./cmd/cmb-gsb publish \
            -in examples/sovereign-transmission.json \
            -source ../../manifestos/CMB_SOVEREIGN_TRANSMISSION.md \
            -out /tmp/cmb-gsb-pages \
            -url https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/ \
            -site-base https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/
          touch /tmp/cmb-gsb-pages/.nojekyll
          mkdir -p /tmp/cmb-gsb-pages/.well-known /tmp/cmb-gsb-pages/agents
          cp ../../agents/agent-card.json /tmp/cmb-gsb-pages/.well-known/agent-card.json
          cp ../../agents/registry.json /tmp/cmb-gsb-pages/agents/registry.json

      - name: Verify deployment contract
        run: |
          test -s /tmp/cmb-gsb-pages/index.html
          test -s /tmp/cmb-gsb-pages/article.jsonld
          test -s /tmp/cmb-gsb-pages/cmb-semantic.json
          test -s /tmp/cmb-gsb-pages/sitemap.xml
          test -s /tmp/cmb-gsb-pages/robots.txt
          test -s /tmp/cmb-gsb-pages/manifest.json
          test -f /tmp/cmb-gsb-pages/.nojekyll
          test -s /tmp/cmb-gsb-pages/.well-known/agent-card.json
          test -s /tmp/cmb-gsb-pages/agents/registry.json
          cmp ../../manifestos/CMB_SOVEREIGN_TRANSMISSION.md /tmp/cmb-gsb-pages/source.md
          grep -Fq '<link rel="canonical" href="https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/">' /tmp/cmb-gsb-pages/index.html
          grep -Fq '<loc>https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/</loc>' /tmp/cmb-gsb-pages/sitemap.xml
          grep -Fq 'Sitemap: https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/sitemap.xml' /tmp/cmb-gsb-pages/robots.txt
          grep -Fq 'Provenance Ledger' /tmp/cmb-gsb-pages/index.html
          grep -Fq 'Human ↔ Machine Boundary' /tmp/cmb-gsb-pages/index.html
          grep -Fq 'Publication Surfaces' /tmp/cmb-gsb-pages/index.html
          if grep -n '—' /tmp/cmb-gsb-pages/index.html /tmp/cmb-gsb-pages/site.css /tmp/cmb-gsb-pages/source.md; then
            echo "Em dash regression detected in the public publication surface"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: /tmp/cmb-gsb-pages

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
