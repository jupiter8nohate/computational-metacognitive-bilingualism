name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "machine/**"
      - "schemas/cmb.fgc-origin-mark.v1.schema.json"
      - "schemas/cmb.machine-ir.v1.schema.json"
      - "src/cmb_machine/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "llms.txt"
      - "llms-full.txt"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "machine/**"
      - "schemas/cmb.fgc-origin-mark.v1.schema.json"
      - "schemas/cmb.machine-ir.v1.schema.json"
      - "src/cmb_machine/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "llms.txt"
      - "llms-full.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: python -m pip install --upgrade pip ".[docs]"

      - name: Stage machine discovery assets
        run: |
          cp llms.txt docs/llms.txt
          cp llms-full.txt docs/llms-full.txt
          cp machine/fgc-origin-mark.json docs/cmb-machine-origin.json
          mkdir -p docs/machine
          cp machine/index.json docs/machine/index.json
          cp machine/cmb-core.ir.json docs/machine/cmb-core.ir.json
          cp machine/targets.json docs/machine/targets.json
          cp machine/cmb_machine_envelope.proto docs/machine/cmb_machine_envelope.proto
          cmb-machine compile-core --output-dir docs/machine/generated

      - name: Build docs
        run: mkdocs build --strict
