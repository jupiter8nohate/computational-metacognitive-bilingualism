name: Stabilization lockfile generator

on:
  push:
    branches:
      - "stabilization/v1.5-freeze-20260906"
    paths:
      - ".github/workflows/stabilization-lockfiles.yml"
      - "adapters/typescript-express/package.json"
      - "adapters/rust-actix/Cargo.toml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit reproducible adapter lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate TypeScript lockfile
        working-directory: adapters/typescript-express
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate Rust lockfile
        working-directory: adapters/rust-actix
        run: cargo generate-lockfile

      - name: Confirm generated files
        run: |
          test -s adapters/typescript-express/package-lock.json
          test -s adapters/rust-actix/Cargo.lock

      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- adapters/typescript-express/package-lock.json adapters/rust-actix/Cargo.lock &&
             git ls-files --error-unmatch adapters/typescript-express/package-lock.json adapters/rust-actix/Cargo.lock >/dev/null 2>&1; then
            echo "Lockfiles are already committed."
            exit 0
          fi

          git config user.name "cmb-stabilization-bot"
          git config user.email "cmb-stabilization-bot@users.noreply.github.com"
          git add adapters/typescript-express/package-lock.json adapters/rust-actix/Cargo.lock
          git commit -m "build: lock adapter dependency graphs"
          git push origin "HEAD:stabilization/v1.5-freeze-20260906"
