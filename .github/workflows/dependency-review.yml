name: Dependency review

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        id: dependency_review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

      - name: Explain unavailable dependency graph
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo "::warning::Dependency Review could not run. Enable GitHub Dependency Graph in repository security settings, then remove continue-on-error from this workflow."
