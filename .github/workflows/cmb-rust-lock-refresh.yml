name: Temporary Cargo lockfile regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cmb-rust-lock-refresh.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1e
        with:
          persist-credentials: false
      - name: Update vulnerable Actix packages
        run: |
          cargo update --manifest-path adapters/rust-actix/Cargo.toml -p actix-web --precise 4.18.2
          cargo update --manifest-path adapters/rust-actix/Cargo.toml -p actix-http --precise 3.20.3
      - name: Emit regenerated lockfile for review
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          blob = Path("adapters/rust-actix/Cargo.lock").read_bytes()
          print("CMB_LOCK_BEGIN")
          print(base64.b64encode(blob).decode("ascii"))
          print("CMB_LOCK_END")
          PY
