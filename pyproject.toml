[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-provenance"
version = "1.4.1"
description = "Artifact sealing and tamper-evident provenance tooling for Computational Metacognitive Bilingualism."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Jupiter Hudson / WisdomLoveThePoet / Jupiter 8 / Joseph Q Hudson" },
]
keywords = [
  "authorship",
  "cmb",
  "digital-rights",
  "integrity",
  "provenance",
  "c2pa",
  "content-credentials",
  "metacognition",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5", "cryptography>=43,<47"]
build = ["build>=1.2,<2"]
docs = ["mkdocs>=1.6,<2"]
mcp = ["mcp>=2,<3"]
sovereignty = ["cryptography>=43,<47"]

[project.scripts]
cmb-provenance = "cmb_provenance.cli:main"
cmb-z13 = "cmb_provenance.z13_cli:main"
cmb-edu = "cmb_edu.cli:main"
cmb-agent = "cmb_agents.cli:main"
cmb-mcp = "cmb_agents.mcp_server:main"
cmb-machine = "cmb_machine.cli:main"
cmb-recovery = "cmb_preservation.cli:main"
cmb-sdl = "cmb_sdl.cli:main"
cmb-cap = "cmb_cap.cli:main"
cmbc = "cmb_policy.runtime_cli:main"
glitch8 = "cmb_glitch8.cli:main"

[project.urls]
Homepage = "https://github.com/jupiter8nohate/computational-metacognitive-bilingualism"
Repository = "https://github.com/jupiter8nohate/computational-metacognitive-bilingualism"
Issues = "https://github.com/jupiter8nohate/computational-metacognitive-bilingualism/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
cmb_provenance = ["py.typed"]
cmb_edu = ["py.typed"]
cmb_policy = ["py.typed"]
cmb_agents = ["py.typed"]
cmb_sdl = ["py.typed"]
cmb_cap = ["py.typed"]
cmb_glitch8 = ["py.typed", "glyphs.v1.json"]
cmb_preservation = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
