<title id="title">The Sovereign Gate, Egyptian cosmic illustration</title>
<desc id="desc">An original vector illustration of an Egyptian temple wall, an astronomical arch, the symbol of Jupiter, twin flamingos, ancient-style symbol wheels and a luminous pyramid gateway. This illustration is not an ancient artifact or transcription.</desc>
