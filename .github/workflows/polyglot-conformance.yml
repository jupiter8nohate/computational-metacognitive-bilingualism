name: Polyglot boundary conformance

on:
  push:
    paths:
      - "adapters/**"
      - "conformance/**"
      - "src/cmb_provenance/boundary.py"
      - "schemas/cmb.boundary-event.v1.schema.json"
      - ".github/workflows/polyglot-conformance.yml"
  pull_request:
    paths:
      - "adapters/**"
      - "conformance/**"
      - "src/cmb_provenance/boundary.py"
      - "schemas/cmb.boundary-event.v1.schema.json"
      - ".github/workflows/polyglot-conformance.yml"

permissions:
  contents: read

jobs:
  typescript-express:
    name: TypeScript + Express
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - name: Install adapter dependencies
        working-directory: adapters/typescript-express
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build strict TypeScript
        working-directory: adapters/typescript-express
        run: npm run build
      - name: Run shared conformance
        working-directory: adapters/typescript-express
        run: npm test

  rust-actix:
    name: Rust + Actix Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Format check
        working-directory: adapters/rust-actix
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: adapters/rust-actix
        run: cargo clippy --all-targets -- -D warnings
      - name: Run shared conformance
        working-directory: adapters/rust-actix
        run: cargo test --all-targets

  go-boundary:
    name: Go standard library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Go version
        run: go version
      - name: Format check
        working-directory: adapters/go
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: adapters/go
        run: go vet ./...
      - name: Run shared conformance
        working-directory: adapters/go
        run: go test ./...
