name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests
        run: pytest
      - name: Run installed self-test
        run: cmb-provenance selftest
      - name: GLITCH-8 registry smoke test
        run: |
          glitch8 glyph validate
          glitch8 glyph explain '▂▃▄▅▆▇▉'
          glitch8 statement parse '⁇ [GO] profile_prediction :: UNVERIFIED :: HUMAN_REVIEW'

  canonical-receipt:
    name: Canonical CMB receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip .
      - name: Generate and verify canonical receipt
        run: >-
          python scripts/seal_canonical_artifacts.py
          --base-dir .
          --output /tmp/cmb-canonical.cmb-receipt.json
          --print-json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and verify entry point
        run: |
          python -m pip install dist/*.whl
          cmb-provenance --version
          cmb-provenance selftest
          cmb-z13 --version
          cmb-z13 validate '♍::GO -> VERIFY[claim] => EVIDENCE_REQUIRED;'
          cmb-edu --version
          cmb-edu validate '🪐::LEARN -> DECLARE[curious || focused] => ASK("how_do_loops_work") -> PATTERN_NOT_PROOF;'
          cmb-edu parse-fgc '🧠 CURIOUS + 🪐 LEARNING + ⚡ ASK WHY + 🛡️ NO_PROFILE'
          cmb-agent --version
          cmb-agent selftest
          cmb-agent recommend 'algorithmic profiling evidence'
          cmb-machine targets
          cmb-machine compile-core --output-dir /tmp/cmb-machine
          cmb-sdl compile examples/cmb_sdl/research.cmb --output /tmp/research.authority.json
          glitch8 glyph validate
          glitch8 glyph explain '▇'
          glitch8 statement parse '⁇ [GO] profile_prediction :: UNVERIFIED :: HUMAN_REVIEW'
          cmbc validate --policy cmb.toml
          cmbc selftest --policy cmb.toml
