name: Signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python-version }} release gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests
        run: pytest
      - name: Run installed self-test
        run: cmb-provenance selftest

  interoperability:
    name: v1.4 interoperability release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install interoperability dependencies
        run: python -m pip install --upgrade pip ".[mcp,sovereignty]"
      - name: Check MCP dependency graph
        run: python -m pip check
      - name: Import MCP server
        run: >-
          python -c
          "from cmb_agents.mcp_server import mcp;
          assert mcp is not None;
          print(type(mcp).__name__)"
      - name: Run CMB agent self-test
        run: cmb-agent selftest
      - name: Run TypeScript boundary conformance
        working-directory: adapters/typescript-express
        run: |
          node --version
          npm --version
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Run Rust boundary conformance
        working-directory: adapters/rust-actix
        run: |
          rustc --version
          cargo --version
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Run Go boundary conformance
        working-directory: adapters/go
        run: |
          go version
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Run sovereignty and authority smoke tests
        run: |
          cmbc validate --policy cmb.toml
          cmbc selftest --policy cmb.toml
          cmb-sdl compile examples/cmb_sdl/research.cmb --output /tmp/research.authority.json
          cmb-cap keygen --private-key /tmp/release-cap.key --public-key /tmp/release-cap.pub
          cmb-cap issue-sdl examples/cmb_sdl/research.cmb             --private-key /tmp/release-cap.key             --output /tmp/research.cmb-cap.json
          cmb-cap verify /tmp/research.cmb-cap.json --public-key /tmp/release-cap.pub


  release:
    needs: [test, interoperability]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip ".[build]"
      - name: Verify tag matches package version
        run: |
          python -c 'import os, cmb_provenance; expected=f"v{cmb_provenance.__version__}"; actual=os.environ["GITHUB_REF_NAME"]; assert actual == expected, f"tag {actual!r} does not match {expected!r}"'
      - name: Build
        run: python -m build
      - name: Check built wheel and all installed entry points
        run: |
          python -m pip install --force-reinstall dist/*.whl "cryptography>=43,<47"
          cmb-provenance --version
          cmb-provenance selftest
          cmb-z13 --version
          cmb-z13 validate '♍::GO -> VERIFY[claim] => EVIDENCE_REQUIRED;'
          cmb-edu --version
          cmb-edu validate '🪐::LEARN -> DECLARE[curious || focused] => ASK("how_do_loops_work") -> PATTERN_NOT_PROOF;'
          cmb-agent --version
          cmb-agent selftest
          cmb-machine targets
          cmb-machine compile-core --output-dir /tmp/cmb-machine-release
          cmb-sdl compile examples/cmb_sdl/research.cmb --output /tmp/research.authority.json
          cmbc validate --policy cmb.toml
          cmbc selftest --policy cmb.toml
          cmb-cap keygen --private-key /tmp/wheel-cap.key --public-key /tmp/wheel-cap.pub
          cmb-cap issue-sdl examples/cmb_sdl/research.cmb             --private-key /tmp/wheel-cap.key             --output /tmp/research.cmb-cap.json
          cmb-cap verify /tmp/research.cmb-cap.json --public-key /tmp/wheel-cap.pub
      - name: Seal canonical public CMB artifacts
        run: >-
          python scripts/seal_canonical_artifacts.py
          --base-dir .
          --output dist/cmb-source.cmb-receipt.json
      - name: Create checksums
        run: python scripts/build_checksums.py dist
      - name: Sign release artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/cmb-source.cmb-receipt.json
          release-signing-artifacts: false
          upload-signing-artifacts: true
      - name: Generate GitHub artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "CMB Provenance $GITHUB_REF_NAME"
