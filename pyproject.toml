[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-provenance"
version = "1.3.1"
description = "Artifact sealing and tamper-evident provenance tooling for Computational Metacognitive Bilingualism."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Jupiter Hudson / WisdomLoveThePoet / Jupiter 8 / Joseph Q Hudson" },
]
keywords = [
  "authorship",
  "cmb",
  "digital-rights",
  "integrity",
  "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["build>=1.2,<2"]

[project.scripts]
cmb-provenance = "cmb_provenance.cli:main"\ncmb-z13 = "cmb_provenance.z13_cli:main"

[project.urls]
Homepage = "https://github.com/jupiter8nohate/computational-metacognitive-bilingualism"
Repository = "https://github.com/jupiter8nohate/computational-metacognitive-bilingualism"
Issues = "https://github.com/jupiter8nohate/computational-metacognitive-bilingualism/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
