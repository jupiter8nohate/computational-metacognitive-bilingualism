name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests
        run: pytest
      - name: Run installed self-test
        run: cmb-provenance selftest

  canonical-receipt:
    name: Canonical CMB receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip .
      - name: Generate and verify canonical receipt
        run: >-
          python scripts/seal_canonical_artifacts.py
          --base-dir .
          --output /tmp/cmb-canonical.cmb-receipt.json
          --print-json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and verify entry point
        run: |
          python -m pip install dist/*.whl
          cmb-provenance --version
          cmb-provenance selftest
          cmb-z13 --version
          cmb-z13 validate '♍::GO -> VERIFY[claim] => EVIDENCE_REQUIRED;'
          cmb-edu --version
          cmb-edu validate '🪐::LEARN -> DECLARE[curious || focused] => ASK("how_do_loops_work") -> PATTERN_NOT_PROOF;'
          cmb-edu parse-fgc '🧠 CURIOUS + 🪐 LEARNING + ⚡ ASK WHY + 🛡️ NO_PROFILE'
          cmb-agent --version
          cmb-agent selftest
          cmb-agent recommend 'algorithmic profiling evidence'
          cmb-machine targets
          cmb-machine harmoni-manifest
          cmb-machine harmoni-evaluate --state PROOF --all-proof-gates
          if cmb-machine harmoni-evaluate --state PROOF > /tmp/harmoni-missingno.json; then
            echo "Expected incomplete proof to fail closed" >&2
            exit 1
          else
            code=$?
            test "$code" -eq 2
            grep -q '"sentinel": "MISSINGNO_666"' /tmp/harmoni-missingno.json
          fi
          cmb-machine compile-core --output-dir /tmp/cmb-machine
