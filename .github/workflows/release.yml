name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python-version }} release gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests
        run: pytest
      - name: Run installed self-test
        run: cmb-provenance selftest

  interoperability:
    name: v1.4 interoperability release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MCP adapter
        run: python -m pip install --upgrade pip ".[mcp]"
      - name: Check MCP dependency graph
        run: python -m pip check
      - name: Import MCP server
        run: >-
          python -c
          "from cmb_agents.mcp_server import mcp;
          assert mcp is not None;
          print(type(mcp).__name__)"
      - name: Run CMB agent self-test
        run: cmb-agent selftest
      - name: Run Go boundary conformance
        working-directory: adapters/go
        run: |
          go version
          test -z "$(gofmt -l .)"
          go test ./...


  release:
    needs: [test, interoperability]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip ".[build]"
      - name: Verify tag matches package version
        run: |
          python -c 'import os, cmb_provenance; expected=f"v{cmb_provenance.__version__}"; actual=os.environ["GITHUB_REF_NAME"]; assert actual == expected, f"tag {actual!r} does not match {expected!r}"'
      - name: Build
        run: python -m build
      - name: Check built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cmb-provenance --version
          cmb-provenance selftest
          cmb-z13 --version
          cmb-z13 validate '♍::GO -> VERIFY[claim] => EVIDENCE_REQUIRED;'
          cmb-edu --version
          cmb-edu validate '🪐::LEARN -> DECLARE[curious || focused] => ASK("how_do_loops_work") -> PATTERN_NOT_PROOF;'
      - name: Seal canonical public CMB artifacts
        run: >-
          python scripts/seal_canonical_artifacts.py
          --base-dir .
          --output dist/cmb-source.cmb-receipt.json
      - name: Create checksums
        run: python scripts/build_checksums.py dist
      - name: Sign release artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/cmb-source.cmb-receipt.json
          release-signing-artifacts: false
          upload-signing-artifacts: true
      - name: Generate GitHub artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "CMB Provenance $GITHUB_REF_NAME"
