name: CMB Google Semantic Pages

on:
  push:
    branches: ["main"]
    paths:
      - "labs/cmb-google-semantic-bridge/**"
      - "MANIFESTO.md"
      - "CMB_Polyglot_Firewall_Specification.md"
      - "CANON.md"
      - "manifestos/**"
      - "policy/**"
      - "docs/**"
      - "schemas/**"
      - "library/**"
      - "agents/**"
      - "src/cmb_agents/**"
      - ".github/workflows/cmb-google-semantic-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "labs/cmb-google-semantic-bridge/**"
      - "MANIFESTO.md"
      - "CMB_Polyglot_Firewall_Specification.md"
      - "CANON.md"
      - "manifestos/**"
      - "policy/**"
      - "docs/**"
      - "schemas/**"
      - "library/**"
      - "agents/**"
      - "src/cmb_agents/**"
      - ".github/workflows/cmb-google-semantic-pages.yml"
  workflow_dispatch:

concurrency:
  group: cmb-google-semantic-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build canon library publication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/cmb-google-semantic-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Test publisher
        run: go test -race ./...

      - name: Build CMB canon library
        run: |
          rm -rf /tmp/cmb-gsb-pages
          go run ./cmd/cmb-gsb publish-canon \
            -root ../.. \
            -canon ../../library/canon.json \
            -catalog ../../library/catalog.json \
            -out /tmp/cmb-gsb-pages \
            -base-url https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/
          touch /tmp/cmb-gsb-pages/.nojekyll

      - name: Verify deployment contract
        run: |
          test -s /tmp/cmb-gsb-pages/index.html
          test -s /tmp/cmb-gsb-pages/site.css
          test -s /tmp/cmb-gsb-pages/library-index.json
          test -s /tmp/cmb-gsb-pages/collection.jsonld
          test -s /tmp/cmb-gsb-pages/cmb-canon.json
          test -s /tmp/cmb-gsb-pages/catalog.json
          test -s /tmp/cmb-gsb-pages/sitemap.xml
          test -s /tmp/cmb-gsb-pages/robots.txt
          test -s /tmp/cmb-gsb-pages/manifest.json
          test -f /tmp/cmb-gsb-pages/.nojekyll
          test -s /tmp/cmb-gsb-pages/.well-known/agent-card.json
          test -s /tmp/cmb-gsb-pages/agents/registry.json
          test -s /tmp/cmb-gsb-pages/artifacts/cmb-core-manifesto/index.html
          test -s /tmp/cmb-gsb-pages/artifacts/cmb-core-manifesto/source.md
          test -s /tmp/cmb-gsb-pages/artifacts/cmb-sovereign-transmission/index.html
          test -s /tmp/cmb-gsb-pages/artifacts/cmb-sovereign-transmission/source.md
          test -s /tmp/cmb-gsb-pages/artifacts/cmb-canon-graph/cmb-semantic.json
          cmp ../../library/canon.json /tmp/cmb-gsb-pages/cmb-canon.json
          cmp ../../library/catalog.json /tmp/cmb-gsb-pages/catalog.json
          cmp ../../agents/agent-card.json /tmp/cmb-gsb-pages/.well-known/agent-card.json
          cmp ../../agents/registry.json /tmp/cmb-gsb-pages/agents/registry.json
          cmp ../../MANIFESTO.md /tmp/cmb-gsb-pages/artifacts/cmb-core-manifesto/source.md
          cmp ../../manifestos/CMB_SOVEREIGN_TRANSMISSION.md /tmp/cmb-gsb-pages/artifacts/cmb-sovereign-transmission/source.md
          grep -Fq '<link rel="canonical" href="https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/">' /tmp/cmb-gsb-pages/index.html
          grep -Fq '<loc>https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/</loc>' /tmp/cmb-gsb-pages/sitemap.xml
          grep -Fq '<loc>https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/artifacts/cmb-core-manifesto/</loc>' /tmp/cmb-gsb-pages/sitemap.xml
          grep -Fq 'Sitemap: https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/sitemap.xml' /tmp/cmb-gsb-pages/robots.txt
          grep -Fq 'CMB Digital Library' /tmp/cmb-gsb-pages/index.html
          grep -Fq 'Canonical Artifact Index' /tmp/cmb-gsb-pages/index.html
          grep -Fq 'Machine Surfaces' /tmp/cmb-gsb-pages/index.html
          python -c 'import json; d=json.load(open("/tmp/cmb-gsb-pages/library-index.json")); assert len(d["artifacts"]) >= 20; assert d["canonical_url"] == "https://jupiter8nohate.github.io/computational-metacognitive-bilingualism/"'
          if grep -n '—' /tmp/cmb-gsb-pages/index.html /tmp/cmb-gsb-pages/site.css; then
            echo "Em dash regression detected in generated library shell"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: /tmp/cmb-gsb-pages

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
