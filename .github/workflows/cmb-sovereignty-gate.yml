name: CMB Sovereignty Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sovereignty-runtime:
    name: CMB SRP-2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sovereignty runtime
        run: python -m pip install --upgrade pip ".[test,sovereignty]"
      - name: Validate machine-readable policy and detectors
        run: cmbc validate --policy cmb.toml
      - name: Run CMB runtime self-test
        run: cmbc selftest --policy cmb.toml
      - name: Run sovereignty runtime tests
        run: pytest tests/test_sovereignty_runtime.py tests/test_srp2_detection.py
      - name: Prove critical operations fail closed without authorization
        shell: bash
        run: |
          if cmbc assess deploy_production \
            --policy cmb.toml \
            --evidence isolated_verification=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --evidence reproducible_build=sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            --evidence two_party_review=sha256:3333333333333333333333333333333333333333333333333333333333333333; then
            echo "CMB gate unexpectedly allowed unsigned production deployment."
            exit 1
          fi
          echo "Expected denial confirmed: production deployment requires scoped human authorization."
      - name: Scan and enforce pull-request changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cmbc scan-git \
            --policy cmb.toml \
            --base "origin/${GITHUB_BASE_REF}" \
            --head HEAD \
            --output /tmp/cmb-scan-report.json
          cmbc statement \
            --policy cmb.toml \
            --report /tmp/cmb-scan-report.json \
            --state FIX_TESTED \
            --output /tmp/cmb-scan-statement.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/cmb-scan-report.json", encoding="utf-8"))
          summary = report["summary"]
          print("CMB SRP-2 report digest:", report["report_digest"])
          print("CMB SRP-2 operations:", ", ".join(report["operations"]) or "none")
          print("CMB SRP-2 highest criticality:", summary["highest_criticality"])
          PY

          set +e
          cmbc gate-report \
            --policy cmb.toml \
            --report /tmp/cmb-scan-report.json \
            --project "${GITHUB_REPOSITORY}" \
            > /tmp/cmb-gate-result.json
          gate_status=$?
          set -e

          cat /tmp/cmb-gate-result.json
          if [ "${gate_status}" -ne 0 ]; then
            latest_commit_message="$(git log -1 --pretty=%B)"
            if [ "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}" ] && \
               grep -q '^CMB-AUTHORIZED:' <<< "${latest_commit_message}"; then
              echo "CMB SRP-2 platform-owner governance override accepted."
              echo "This is explicit GitHub-account authorization, not an Ed25519 CMB authorization."
              echo "Use signed CMB authorization or protected-review policy for stronger deployments."
              exit 0
            fi

            echo "CMB SRP-2 denied this change set."
            echo "High-friction operations require scoped authorization and content-addressed evidence."
            echo "Repository-owner governance recovery additionally requires a latest-commit CMB-AUTHORIZED: marker."
            exit "${gate_status}"
          fi
