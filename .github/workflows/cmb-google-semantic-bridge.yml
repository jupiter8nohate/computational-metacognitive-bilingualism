name: CMB Google Semantic Bridge

on:
  push:
    paths:
      - "labs/cmb-google-semantic-bridge/**"
      - ".github/workflows/cmb-google-semantic-bridge.yml"
  pull_request:
    paths:
      - "labs/cmb-google-semantic-bridge/**"
      - ".github/workflows/cmb-google-semantic-bridge.yml"

permissions:
  contents: read

jobs:
  go:
    name: Go 1.27 semantic bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/cmb-google-semantic-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/cmb-gsb
      - name: Validate example
        run: go run ./cmd/cmb-gsb validate -in examples/cmb-manifesto.json
      - name: Render example
        run: go run ./cmd/cmb-gsb render -in examples/cmb-manifesto.json -out /tmp/cmb-gsb-output
      - name: Check metadata render files
        run: |
          test -s /tmp/cmb-gsb-output/article.jsonld
          test -s /tmp/cmb-gsb-output/cmb-semantic.json
          test -s /tmp/cmb-gsb-output/head.html
          test -s /tmp/cmb-gsb-output/sitemap.xml
          test -s /tmp/cmb-gsb-output/robots.txt
          test -s /tmp/cmb-gsb-output/manifest.json
      - name: Publish Sovereign Transmission fixture
        run: |
          go run ./cmd/cmb-gsb publish \
            -in examples/sovereign-transmission.json \
            -source ../../manifestos/CMB_SOVEREIGN_TRANSMISSION.md \
            -out /tmp/cmb-gsb-site
      - name: Check publication bundle
        run: |
          test -s /tmp/cmb-gsb-site/index.html
          test -s /tmp/cmb-gsb-site/site.css
          test -s /tmp/cmb-gsb-site/source.md
          test -s /tmp/cmb-gsb-site/article.jsonld
          test -s /tmp/cmb-gsb-site/cmb-semantic.json
          test -s /tmp/cmb-gsb-site/sitemap.xml
          test -s /tmp/cmb-gsb-site/robots.txt
          test -s /tmp/cmb-gsb-site/manifest.json
          cmp ../../manifestos/CMB_SOVEREIGN_TRANSMISSION.md /tmp/cmb-gsb-site/source.md
          grep -q "CMB // The Sovereign Transmission" /tmp/cmb-gsb-site/index.html
