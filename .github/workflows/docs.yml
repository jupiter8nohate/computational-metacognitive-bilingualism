name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "datasets/**"
      - "assets/**"
      - "machine/**"
      - "agents/**"
      - "extensions/**"
      - "library/**"
      - "schemas/**"
      - "research/case-studies/**"
      - "examples/polyglot/jupiter_glitchology_runtime/**"
      - "spec/**"
      - "src/cmb_machine/**"
      - "src/cmb_agents/**"
      - "scripts/build_docs.py"
      - "scripts/build_watch_intelligence.py"
      - "tests/test_watch_intelligence.py"
      - "scripts/enrich_search_metadata.py"
      - "tests/test_search_metadata.py"
      - "scripts/verify_archive_experience.py"
      - "scripts/export_reader_archive.py"
      - "tests/test_archive_experience.py"
      - "scripts/verify_2084_evidence.py"
      - "tests/test_2084_witness_evidence.py"
      - "tests/test_site_integrity.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "AGENTS.md"
      - "llms.txt"
      - "llms-full.txt"
      - "12d2a43be91ea62d037b07cba4432de24a5713f7fc4d3f50a8c5d468c3a43176.txt"
      - "CITATION.bib"
      - "CITATION.cff"
      - "robots.txt"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "datasets/**"
      - "assets/**"
      - "machine/**"
      - "agents/**"
      - "extensions/**"
      - "library/**"
      - "schemas/**"
      - "research/case-studies/**"
      - "examples/polyglot/jupiter_glitchology_runtime/**"
      - "spec/**"
      - "src/cmb_machine/**"
      - "src/cmb_agents/**"
      - "scripts/build_docs.py"
      - "scripts/enrich_search_metadata.py"
      - "tests/test_search_metadata.py"
      - "scripts/verify_2084_evidence.py"
      - "tests/test_2084_witness_evidence.py"
      - "tests/test_site_integrity.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "AGENTS.md"
      - "llms.txt"
      - "llms-full.txt"
      - "12d2a43be91ea62d037b07cba4432de24a5713f7fc4d3f50a8c5d468c3a43176.txt"
      - "CITATION.bib"
      - "CITATION.cff"
      - "robots.txt"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: python -m pip install --upgrade pip ".[docs]" "pytest>=8,<10"

      - name: Audit 2084 witness registry
        run: python scripts/verify_2084_evidence.py

      - name: Audit archive reader, glyphs, and evidence boundaries
        run: python scripts/verify_archive_experience.py

      - name: Audit CMB evolution and source boundaries
        run: python scripts/audit_evolution.py

      - name: Test Watch research and evidence boundaries
        run: python -m pytest -q tests/test_watch_intelligence.py tests/test_watch_observatory.py tests/test_global_ai_watch.py

      - name: Build and verify public documentation bundle
        run: python scripts/build_docs.py
