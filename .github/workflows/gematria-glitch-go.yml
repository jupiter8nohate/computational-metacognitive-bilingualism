name: Gematria Glitch Go

on:
  pull_request:
    paths:
      - "tools/gematria-glitch/**"
      - "spec/GEMATRIA-GLITCH-1.md"
      - "agents/gematria-anomaly-evaluation.json"
      - "schemas/gematria-glitch.finding.v1.schema.json"
      - "schemas/gematria-glitch.corpus.v1.schema.json"
      - "schemas/gematria-glitch.receipt.v1.schema.json"
      - "schemas/gematria-glitch.graph.v1.schema.json"
      - "schemas/gematria-glitch.path-query.v1.schema.json"
      - "schemas/gematria-glitch.multicorpus.v1.schema.json"
      - "schemas/gematria-glitch.null-model.v1.schema.json"
      - "schemas/gematria-glitch.null-model.v1.1.schema.json"
      - "schemas/gematria-glitch.null-ensemble.v1.schema.json"
      - "schemas/gematria-glitch.out-of-sample.v1.schema.json"
      - "docs/GEMATRIA_OUT_OF_SAMPLE_VALIDATION.md"
      - "docs/GEMATRIA_NULL_MODEL_ENSEMBLE.md"
      - "docs/GEMATRIA_NULL_MODEL.md"
      - "docs/GEMATRIA_MULTI_CORPUS_REPLICATION.md"
      - "docs/GEMATRIA_GRAPH_PATH_DISCOVERY.md"
      - "docs/GEMATRIA_ANOMALY_KNOWLEDGE_GRAPH.md"
      - "datasets/gematria/**"
      - ".github/workflows/gematria-glitch-go.yml"
  push:
    branches:
      - main
    paths:
      - "tools/gematria-glitch/**"
      - "spec/GEMATRIA-GLITCH-1.md"
      - "agents/gematria-anomaly-evaluation.json"
      - "schemas/gematria-glitch.finding.v1.schema.json"
      - "schemas/gematria-glitch.corpus.v1.schema.json"
      - "schemas/gematria-glitch.receipt.v1.schema.json"
      - "schemas/gematria-glitch.graph.v1.schema.json"
      - "schemas/gematria-glitch.path-query.v1.schema.json"
      - "schemas/gematria-glitch.multicorpus.v1.schema.json"
      - "schemas/gematria-glitch.null-model.v1.schema.json"
      - "schemas/gematria-glitch.null-model.v1.1.schema.json"
      - "schemas/gematria-glitch.null-ensemble.v1.schema.json"
      - "schemas/gematria-glitch.out-of-sample.v1.schema.json"
      - "docs/GEMATRIA_OUT_OF_SAMPLE_VALIDATION.md"
      - "docs/GEMATRIA_NULL_MODEL_ENSEMBLE.md"
      - "docs/GEMATRIA_NULL_MODEL.md"
      - "docs/GEMATRIA_MULTI_CORPUS_REPLICATION.md"
      - "docs/GEMATRIA_GRAPH_PATH_DISCOVERY.md"
      - "docs/GEMATRIA_ANOMALY_KNOWLEDGE_GRAPH.md"
      - "datasets/gematria/**"
      - ".github/workflows/gematria-glitch-go.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gematria-glitch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Unit tests
        run: go test ./...

      - name: Demo scan
        run: go run . -format glitch > /tmp/gematria-glitch.txt

      - name: Ranked JSON scan
        run: go run . -format json -rank > /tmp/gematria-glitch-ranked.json

      - name: Generate provenance receipts
        run: go run . -input ../../datasets/gematria/demo-corpus.v1.json -format receipts -rank > /tmp/gematria-glitch-receipts.json

      - name: Verify provenance receipts
        run: go run . -input ../../datasets/gematria/demo-corpus.v1.json -verify-receipts /tmp/gematria-glitch-receipts.json

      - name: Generate anomaly knowledge graph
        run: go run . -input ../../datasets/gematria/demo-corpus.v1.json -format graph > /tmp/gematria-glitch-graph.json

      - name: Verify anomaly knowledge graph
        run: go run . -input ../../datasets/gematria/demo-corpus.v1.json -verify-graph /tmp/gematria-glitch-graph.json

      - name: Query graph paths
        run: |
          go run . -input ../../datasets/gematria/demo-corpus.v1.json -path-from נחש -path-to משיח -path-depth 2 -path-limit 5 -path-format json > /tmp/gematria-glitch-paths.json
          go run . -input ../../datasets/gematria/demo-corpus.v1.json -path-from שלום -path-to תורה -path-depth 4 -path-limit 5 -path-format glitch > /tmp/gematria-glitch-paths.txt

      - name: Compare multiple corpora
        run: |
          go run . -compare-inputs ../../datasets/gematria/demo-corpus.v1.json,../../datasets/gematria/demo-corpus.replication.v1.json -compare-format json > /tmp/gematria-glitch-multicorpus.json
          go run . -compare-inputs ../../datasets/gematria/demo-corpus.v1.json,../../datasets/gematria/demo-corpus.replication.v1.json -compare-format glitch > /tmp/gematria-glitch-multicorpus.txt

      - name: Run permutation null model
        run: |
          go run . -input ../../datasets/gematria/demo-corpus.v1.json -null-model -null-simulations 2000 -null-seed 369 -null-format json > /tmp/gematria-glitch-null.json
          grep -q '"schema_version": "gematria-glitch.null-model.v1.1"' /tmp/gematria-glitch-null.json
          grep -q '"multiple_testing": "benjamini_hochberg_fdr"' /tmp/gematria-glitch-null.json
          grep -q '"bh_adjusted_q_value"' /tmp/gematria-glitch-null.json
          go run . -input ../../datasets/gematria/demo-corpus.v1.json -null-model -null-simulations 2000 -null-seed 369 -null-format glitch > /tmp/gematria-glitch-null.txt

      - name: Run null-model ensemble
        run: |
          go run . -input ../../datasets/gematria/demo-corpus.v1.json -null-ensemble -null-simulations 2000 -null-seed 369 -null-q-threshold 0.05 -null-format json > /tmp/gematria-glitch-null-ensemble.json
          grep -q '"schema_version": "gematria-glitch.null-ensemble.v1"' /tmp/gematria-glitch-null-ensemble.json
          grep -q '"value_permutation"' /tmp/gematria-glitch-null-ensemble.json
          grep -q '"word_length_stratified_value_permutation"' /tmp/gematria-glitch-null-ensemble.json
          grep -q '"worst_case_q_value"' /tmp/gematria-glitch-null-ensemble.json
          go run . -input ../../datasets/gematria/demo-corpus.v1.json -null-ensemble -null-simulations 2000 -null-seed 369 -null-format glitch > /tmp/gematria-glitch-null-ensemble.txt

      - name: Run out-of-sample validation
        run: |
          go run . -discovery-input ../../datasets/gematria/demo-corpus.v1.json -validation-input ../../datasets/gematria/demo-corpus.replication.v1.json -validation-format json > /tmp/gematria-glitch-validation.json
          grep -q '"schema_version": "gematria-glitch.out-of-sample.v1"' /tmp/gematria-glitch-validation.json
          grep -q '"candidate_set_sha256"' /tmp/gematria-glitch-validation.json
          grep -q '"hypothesis_set_sha256"' /tmp/gematria-glitch-validation.json
          grep -q '"CLASS_RECURRED_OUT_OF_SAMPLE"' /tmp/gematria-glitch-validation.json
          grep -q '"INSTANCE_REPLICATED_IN_VALIDATION"' /tmp/gematria-glitch-validation.json
          go run . -discovery-input ../../datasets/gematria/demo-corpus.v1.json -validation-input ../../datasets/gematria/demo-corpus.replication.v1.json -validation-format glitch > /tmp/gematria-glitch-validation.txt
