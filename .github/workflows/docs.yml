name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "machine/**"
      - "schemas/cmb.fgc-origin-mark.v1.schema.json"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "llms.txt"
      - "llms-full.txt"
      - "llms.txt"
      - "llms-full.txt"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: python -m pip install --upgrade pip ".[docs]"

      - name: Stage machine discovery assets
        run: |
          cp llms.txt docs/llms.txt
          cp llms-full.txt docs/llms-full.txt
          cp machine/fgc-origin-mark.json docs/cmb-machine-origin.json

      - name: Build docs
        run: mkdocs build --strict
