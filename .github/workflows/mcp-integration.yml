name: MCP integration

on:
  push:
    paths:
      - "src/cmb_agents/**"
      - "agents/**"
      - "tests/test_mcp_adapter.py"
      - "pyproject.toml"
      - ".github/workflows/mcp-integration.yml"
  pull_request:
    paths:
      - "src/cmb_agents/**"
      - "agents/**"
      - "tests/test_mcp_adapter.py"
      - "pyproject.toml"
      - ".github/workflows/mcp-integration.yml"

permissions:
  contents: read

jobs:
  mcp-python:
    name: MCP Python SDK 2.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CMB with MCP support
        run: python -m pip install --upgrade pip ".[test,mcp]"

      - name: Import installed MCP server
        run: python -c "from cmb_agents.mcp_server import mcp; print(mcp.name)"

      - name: Run MCP adapter tests
        run: pytest tests/test_mcp_adapter.py
