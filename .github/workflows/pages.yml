name: Deploy documentation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "machine/**"
      - "agents/**"
      - "schemas/**"
      - "spec/**"
      - "src/cmb_machine/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "llms.txt"
      - "llms-full.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip ".[docs]"

      - name: Build documentation
        run: mkdocs build --strict --site-dir site

      - name: Stage machine and agent discovery assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/.well-known site/agents site/machine/generated site/schemas site/spec
          cp llms.txt site/llms.txt
          cp llms-full.txt site/llms-full.txt
          cp machine/fgc-origin-mark.json site/cmb-machine-origin.json
          cp machine/index.json site/machine/index.json
          cp machine/cmb-core.ir.json site/machine/cmb-core.ir.json
          cp machine/targets.json site/machine/targets.json
          cp machine/knowledge-graph.jsonld site/machine/knowledge-graph.jsonld
          cp machine/discovery-manifest.json site/machine/discovery-manifest.json
          cp machine/cmb_machine_envelope.proto site/machine/cmb_machine_envelope.proto
          cp agents/agent-card.json site/.well-known/agent-card.json
          cp agents/agent-card.json site/agents/agent-card.json
          cp agents/registry.json site/agents/registry.json
          cp -R schemas/. site/schemas/
          cp -R spec/. site/spec/
          cmb-machine compile-core --output-dir site/machine/generated

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
