name: CMB Sovereignty Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sovereignty-runtime:
    name: CMB SRP-2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sovereignty runtime
        run: python -m pip install --upgrade pip ".[test,sovereignty]"
      - name: Validate machine-readable policy and detectors
        run: cmbc validate --policy cmb.toml
      - name: Run CMB runtime self-test
        run: cmbc selftest --policy cmb.toml
      - name: Run sovereignty runtime tests
        run: pytest tests/test_sovereignty_runtime.py tests/test_srp2_detection.py
      - name: Prove critical operations fail closed without authorization
        shell: bash
        run: |
          if cmbc assess deploy_production \
            --policy cmb.toml \
            --evidence reproducible_build=ci; then
            echo "CMB gate unexpectedly allowed unsigned production deployment."
            exit 1
          fi
          echo "Expected denial confirmed: production deployment requires scoped human authorization."
      - name: Scan pull-request changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cmbc scan-git \
            --policy cmb.toml \
            --base "origin/${GITHUB_BASE_REF}" \
            --head HEAD \
            --output /tmp/cmb-scan-report.json
          cmbc statement \
            --policy cmb.toml \
            --report /tmp/cmb-scan-report.json \
            --state FIX_TESTED \
            --output /tmp/cmb-scan-statement.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/cmb-scan-report.json", encoding="utf-8"))
          summary = report["summary"]
          print("CMB SRP-2 report digest:", report["report_digest"])
          print("CMB SRP-2 operations:", ", ".join(report["operations"]) or "none")
          print("CMB SRP-2 highest criticality:", summary["highest_criticality"])
          PY
